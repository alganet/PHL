name: 'Make Action'
description: 'Reusable action to run make commands for jobs'

inputs:
  name:
    description: 'The build name (e.g., x86_64-linux-gnu). Will be used to determine OS.'
    required: true
  mode:
    description: 'The build mode (e.g., full, tiny, coverage).'
    required: false
    default: 'full'
  make:
    description: 'The make command to run (e.g., test, test-compat, or empty for build). Will be used to name artifacts.'
    required: false
    default: ''
  make_args:
    description: 'Extra make variables/args appended to the command line (e.g., SHARD=2/4).'
    required: false
    default: ''
  extension:
    description: 'File extension for the binary (e.g., .exe for Windows)'
    required: false
    default: ''
  artifacts_from:
    description: 'Job name to restore artifact from. If set, downloads artifact with name {artifacts_from_mode}-{name}.'
    required: false
  artifacts_from_mode:
    description: 'The mode of the artifact to restore.'
    required: false
    default: 'full'
  artifacts:
    description: 'Whether to upload the build artifacts.'
    required: false
    default: 'false'
  artifact_name:
    description: 'Override the uploaded artifact name (default: derived from make/mode + name).'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - if: inputs.artifacts_from != ''
      name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifacts_from_mode }}-${{ inputs.name }}
        path: build/${{ inputs.name }}

    - if: inputs.artifacts_from != '' && (contains(inputs.name, '-linux') || contains(inputs.name, '-darwin'))
      run: chmod +x build/${{ inputs.name }}/${{ inputs.artifacts_from_mode }}/phl${{ inputs.extension }}
      shell: bash

    - if: contains(inputs.name, '-linux') || contains(inputs.name, '-darwin')
      run: make MODE=${{ inputs.mode }} ${{ inputs.make }} ${{ inputs.make_args }}
      shell: bash

    - if: contains(inputs.name, '-windows')
      run: build-aux/dev.bat nmake /nologo MODE=${{ inputs.mode }} ${{ inputs.make }} ${{ inputs.make_args }}
      shell: cmd

    - if: inputs.artifacts == 'true'
      name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.artifact_name != '' && inputs.artifact_name || format('{0}-{1}', (inputs.make == '' || inputs.make == 'build') && inputs.mode || inputs.make, inputs.name) }}
        path: build/${{ inputs.name }}
