name: 'Setup Action'
description: 'Reusable action to run setup dependencies'

runs:
  using: 'composite'
  steps:
    - if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: lcov libpcre2-dev libxml2-dev
        version: 1.2
    # The Ubuntu runner ships an older php (8.3) whose ValueError / arity
    # wording predates 8.4/8.5; the cross-engine oracle must be the version PHL
    # targets, matching the Homebrew php used on macOS below.
    - if: runner.os == 'Linux'
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
    - if: runner.os == 'macOS'
      uses: tecolicom/actions-use-homebrew-tools@v1
      with:
        tools: lcov php pcre2 libxml2
        cache: yes
        key: brewcache-2.2
    # Homebrew installs php.ini-DEVELOPMENT as php.ini, while setup-php gives the
    # Linux and Windows oracles the production file. The two disagree on what a
    # program prints -- zend.exception_ignore_args decides whether an unhandled
    # match names its value or its type, zend.assertions whether assert() runs --
    # so every such row was red on macOS alone. Use the production file Homebrew
    # installs beside it, so all three oracles answer under the same defaults.
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        ini="$(php -r 'echo php_ini_loaded_file();')"
        cp "$(dirname "$ini")/php.ini-production" "$ini"
        php -i | grep -E '^zend\.(assertions|exception_ignore_args) '
    # Homebrew's libxml2 is keg-only; expose its .pc so pkg-config finds it.
    - if: runner.os == 'macOS'
      shell: bash
      run: echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
    - if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2
    - if: runner.os == 'Windows'
      shell: cmd
      run: vcpkg install pcre2:x64-windows-static "libxml2[core]:x64-windows-static"
    - if: runner.os == 'Windows'
      uses: actions/cache@v4
      id: cache-opencppcoverage
      with:
        path: OpenCppCoverageSetup-x64-*
        key: OpenCppCoverage-${{ hashFiles('build-aux/install_opencppcoverage.bat') }}
        restore-keys: OpenCppCoverage-
    - if: runner.os == 'Windows'
      shell: cmd
      run: build-aux\install_opencppcoverage.bat
    # Pin the Windows oracle php to the version PHL targets (8.5), matching the
    # Linux/macOS oracle above. The runner's DEFAULT php drifts by image version,
    # so test-compat was silently comparing against an arbitrary php on Windows.
    - if: runner.os == 'Windows'
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
