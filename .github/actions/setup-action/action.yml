name: 'Setup Action'
description: 'Reusable action to run setup dependencies'

runs:
  using: 'composite'
  steps:
    - if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: lcov libpcre2-dev
        version: 1.1
    - if: runner.os == 'macOS'
      uses: tecolicom/actions-use-homebrew-tools@v1
      with:
        tools: lcov php pcre2
        cache: yes
        key: brewcache-2.1
    - if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2
    - if: runner.os == 'Windows'
      shell: cmd
      run: vcpkg install pcre2:x64-windows-static
    - if: runner.os == 'Windows'
      uses: actions/cache@v4
      id: cache-opencppcoverage
      with:
        path: OpenCppCoverageSetup-x64-*
        key: OpenCppCoverage-${{ hashFiles('build-aux/install_opencppcoverage.bat') }}
        restore-keys: OpenCppCoverage-
    - if: runner.os == 'Windows'
      shell: cmd
      run: build-aux\install_opencppcoverage.bat
    - if: runner.os == 'Windows'
      shell: cmd
      run: rem PHP is installed by default on Windows runners
